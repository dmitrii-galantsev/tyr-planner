# /etc/nginx/conf.d/tyrhq-cache.conf (http context). TYR HQ at popi.tech/hq: the page, scripts, styles
# and data revalidate on every load (ETag/Last-Modified, so usually a 304), which makes a deploy or a
# data sync show up on the next visit. Images keep nginx's default (browser heuristic) caching.
map $uri $tyrhq_cache_control {
    default "";
    "~^/hq/(.*\.(html|js|css|json|webmanifest))?$" "no-cache";
}
