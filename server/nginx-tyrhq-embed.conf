# /etc/nginx/snippets/tyrhq-embed.conf, included from the popi.tech server block.
# Share links (/hq/b/<code>) and their card images (/hq/og/<code>.png) go to the TYR HQ embed
# service (server/ in tyr-planner, systemd unit tyrhq-embed). If it is down, share links still open the
# build in the static planner.
# Cache-Control for /hq/ text assets (map in conf.d/tyrhq-cache.conf; empty, so not sent, elsewhere).
# An add_header at server level replaces the http-level ones from nginx.conf for this whole server,
# so the security headers are included again here.
add_header Cache-Control $tyrhq_cache_control;
include snippets/security-headers.conf;

location ~ ^/hq/b/(?<hq_code>[A-Za-z0-9_-]+)/?$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @tyrhq_b_fallback;
}
location @tyrhq_b_fallback {
    return 302 /hq/#s=$hq_code;
}
location ^~ /hq/og/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
}
location ^~ /hq/api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @tyrhq_api_down;
}
location @tyrhq_api_down {
    default_type application/json;
    return 503 '{"error":"loadouts are unavailable right now"}';
}
