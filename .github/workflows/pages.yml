# Builds the planner from GameData and publishes it to GitHub Pages.
# This copy has no community builds (data/ is not in the repository); share links point to popi.tech.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true # GameData: only generated/runtime.json is needed, so no Git LFS
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
